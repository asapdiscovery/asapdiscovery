name: alchemy
channels:
  - openeye
  - conda-forge
dependencies:
  # Base
  - pip
  - python >=3.12,<3.13

  # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-timeout
  - pytest-console-scripts
  - codecov
  - requests-mock
  - mock
  - pooch

  # Core
  - click
  - appdirs
  - pydantic >2
  - pydantic-settings
  - numpy <2.5
  - pandas
  - pebble
  - rdkit
  - openff-toolkit =0.18.0
  - openff-interchange >=0.5.0,!=0.5.1
  - openff-forcefields >=2024.04.0
  - openeye-toolkits
  - multimethod

  # Data services
  - requests
  - boto3
  - moto
  - flask
  - flask-cors
  - typing-extensions
  - biopython
  - validators
  - pyyaml
  - ase
  - sigfig

  # Execution
  - dask
  - distributed
#  - dask-jobqueue
  - netifaces

  # Alchemy / Free energy
  - openfe =1.12.0
  - gufe =1.12.0
  - openmm =8.2.0
  - openmmforcefields =0.15.1
  - mdtraj
  - httpx
  - kartograf
  - rich
  - alchemiscale-client >=0.7.2
  - feflow =0.2.1
  - cinnabar >=0.6.0
  - seaborn
  - panel
  - plotmol
  - semver

  # alchemiscale-fah dependencies
  - cryptography
  - plyvel
  - pip:
    - numpy >=2,<2.5
    - git+https://github.com/OpenFreeEnergy/alchemiscale-fah.git@v0.3.1
    - openconf
