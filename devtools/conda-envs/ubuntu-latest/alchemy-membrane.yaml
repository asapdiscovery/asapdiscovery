# Environment for membrane-bound alchemistry (openfe 1.12 stack).
#
# This is a SECOND, parallel stack to alchemy.yaml, which stays on openfe 1.8. It exists
# because gufe's ProteinMembraneComponent -- the only way to express a membrane-embedded
# receptor -- landed in openfe 1.11.
#
# Do not "tidy" the pins below. Each was established the hard way:
#   * openff-interchange  ceiling 0.5.3  -- 0.5.4+ requires pydantic >=2.13, gufe 1.12
#                                           requires pydantic <2.12. Irreconcilable.
#   * openmmforcefields   ceiling 0.15.1 -- 0.16.0 requires openmm >=8.5.1, and every
#                                           openmm 8.5.x build requires cuda-version >=12.9.
#   * openmm              pinned 8.2.0   -- as above.
#   * perses              REMOVED        -- openfe 1.12 dropped PersesAtomMapper and
#                                           perses_scorers; asapdiscovery degrades those
#                                           gracefully (see schema/atom_mapping.py).
#
# NOTE: networks planned on this stack cannot be deserialised by an openfe 1.8 client --
# openfe 1.12 writes `barostat` and `surface_tension` into every IntegratorSettings, which
# 1.8 rejects as extra fields. Status/monitoring still works cross-stack; gather does not.
name: alchemy-membrane
channels:
  - openeye
  - conda-forge
dependencies:
  # Base
  - pip
  - python >=3.12,<3.13

  # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-timeout
  - pytest-console-scripts
  - codecov
  - requests-mock
  - mock
  - pooch

  # Core
  - click
  - appdirs
  - pydantic >2
  - pydantic-settings
  - numpy <2.5
  - pandas
  - pebble
  - rdkit
  - openff-toolkit =0.18.1
  - openff-interchange =0.5.3  # ceiling: 0.5.4+ needs pydantic >=2.13, gufe 1.12 needs <2.12
  - openff-fragmenter
  - openff-forcefields >=2024.04.0
  - openeye-toolkits
  - scipy >=1.13.1

  # Data services
  - requests
  - boto3
  - moto
  - flask
  - flask-cors
  - typing-extensions
  - biopython
  - validators
  - pyyaml
  - ase
  - sigfig

  # Execution
  - dask
  - distributed
#  - dask-jobqueue
  - netifaces

  # Sequence alignment
  - mafft

  # Alchemy / Free energy
  - openfe =1.12.0
  - gufe =1.12.0
  - openmm =8.2.0
  - openmmforcefields =0.15.1  # ceiling: 0.16.0 needs openmm >=8.5.1, which needs cuda >=12.9
  - mdtraj
  - httpx
  - kartograf
  - rich
  - alchemiscale-client >=0.7.2
  - feflow =0.2.1
  - cinnabar >=0.4.1
  - seaborn
  - panel
  - plotmol
  - semver

  # alchemiscale-fah dependencies
  - cryptography
  - plyvel
  - pip:
    - numpy >=2,<2.5
    - git+https://github.com/OpenFreeEnergy/alchemiscale-fah.git@v0.3.1
    - openconf
